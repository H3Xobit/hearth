[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth"
version = "0.1.0"
description = "Live posture ranking from a room camera."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pose = [
  "rtmlib>=0.0.13",
  "onnxruntime>=1.16",
  "opencv-python-headless>=4.9",
]
dev = ["pytest>=8"]

[project.scripts]
hearth = "hearth.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
